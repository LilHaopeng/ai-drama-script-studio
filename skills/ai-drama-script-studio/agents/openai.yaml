interface:
  display_name: "AI短剧与沙雕短剧编剧工作室"
  short_description: "支持从零原创与短/商业长/出版长篇小说改编的AI短剧全流程编剧：写前5问预匹配、MiniMax-H3/漫剧/沙雕三大模板、控算力资产表、分集剧本、按需分镜、视听体检与红果纯净导出"
  default_prompt: "使用 $ai-drama-script-studio 对当前创意、市场雷达选题简报或已有小说/大纲（含 webnovel-short-studio / webnovel-long-studio / 长篇三件套底稿）完成剧种选型与写前节奏逻辑 5 问预匹配，建立控算力固定资产表与分集卡点纲，再按 MiniMax-H3 写实 AI 剧、高奇观漫剧或沙雕短剧规范撰写完整剧本并完成视听体检与导出。"
